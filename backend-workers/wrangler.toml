# TradeReady backend — Cloudflare Workers.
# Secrets are NEVER set here — use `wrangler secret put <NAME>` (Phase 4):
#   STRIPE_SECRET_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY,
#   STRIPE_CONNECT_WEBHOOK_SECRET, REVENUECAT_WEBHOOK_SECRET, CRON_SECRET,
#   RESEND_API_KEY, GROQ_API_KEY
# Local dev reads .dev.vars (gitignored) — see .dev.vars.example.

name = "tradeready-backend"
main = "src/index.js"
# Latest date supported by the pinned workerd (1.20260801.1); the plan's
# 2026-08-05 is ahead of what wrangler ships and is rejected at startup.
compatibility_date = "2026-08-01"
# node:crypto (timingSafeEqual, randomBytes) + Buffer for lib/constantTime.js
# and the ported token-minting endpoints; also keeps the stripe SDK happy.
compatibility_flags = ["nodejs_compat"]

[triggers]
# Same schedule vercel.json's crons ran: daily 15:00 UTC.
crons = ["0 15 * * *"]

[vars]
# Non-secret only — everything else via `wrangler secret put`.
# SUPABASE_URL / ESTIMATE_PUBLIC_ORIGIN / ESTIMATE_PUBLIC_BASE /
# CHANGE_PUBLIC_BASE are wired in Phase 4 to mirror the live Vercel values.
