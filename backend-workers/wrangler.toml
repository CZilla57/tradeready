# TradeReady backend — Cloudflare Workers.
# Secrets are NEVER set here — use `wrangler secret put <NAME>` (Phase 4):
#   STRIPE_SECRET_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY,
#   STRIPE_CONNECT_WEBHOOK_SECRET, REVENUECAT_WEBHOOK_SECRET, CRON_SECRET,
#   RESEND_API_KEY, GROQ_API_KEY,
#   PAY_LINK_SIGNING_SECRET (Phase 24 pay-page tokens; also the rollout switch:
#     unset → create-payment-link keeps minting Stripe Payment Links)
#   API_CURSOR_SECRET (Phase 23 open API: HMAC key for /v1 list cursors;
#     without it /v1 lists answer 503 unavailable)
#   ESIGN_SEAL_PRIVATE_KEY (Phase 19, stage B)
#   API_KEY_TAG_SECRET (Phase 23 open API: HMAC key that tags every API key;
#     at least 32 random bytes, e.g. `openssl rand -base64 48`; without it, or
#     shorter than 44 characters, /v1 answers 503 not_configured and key
#     create/rotate answer 503 unavailable. Changing it invalidates every key)
# Local dev reads .dev.vars (gitignored) — see .dev.vars.example.

name = "tradeready-backend"
main = "src/index.js"
# Latest date supported by the pinned workerd (1.20260801.1); the plan's
# 2026-08-05 is ahead of what wrangler ships and is rejected at startup.
compatibility_date = "2026-08-01"
# node:crypto (timingSafeEqual, randomBytes) + Buffer for lib/constantTime.js
# and the ported token-minting endpoints; also keeps the stripe SDK happy.
compatibility_flags = ["nodejs_compat"]

[triggers]
# Daily 15:00 UTC: payment reminders (same schedule vercel.json's crons ran).
# Every 15 min: the invoice auto-email sweep (2026-08-06 spec) — dispatched
# by pattern in src/index.js scheduled().
crons = ["0 15 * * *", "*/15 * * * *"]

[vars]
ESIGN_REQUIRE_CONSENT = "true"
ESIGN_V2 = "true"
ESIGN_SEAL_PUBLIC_KEYS = '{"k2026-10":"aoEIduHhgJiwSd1/NPgPDISa21riZFmG93stQEzc+PM="}'
ESIGN_SEAL_KEY_ID = "k2026-10"
# Non-secret only — everything else via `wrangler secret put`.
# SUPABASE_URL is public (shipped in the app bundle).
SUPABASE_URL = "https://ncbqswfdvckmdocbawaa.supabase.co"
# Discovered empirically 2026-08-05: live Vercel create-link returns URLs on
# this base (not the github.io code fallback), so the var IS set there.
ESTIMATE_PUBLIC_BASE = "https://gettradereadyapp.com/estimate.html"
# CHANGE_PUBLIC_BASE derives from ESTIMATE_PUBLIC_BASE in code when unset
# (→ https://gettradereadyapp.com/change.html) — leave unset unless the
# Vercel dashboard shows an explicit value. Same for the CORS escape hatch:
# ESTIMATE_PUBLIC_ORIGIN = ""
# CHANGE_PUBLIC_BASE = ""
# PAY_PUBLIC_BASE derives the same way (→ https://gettradereadyapp.com/pay.html,
# the only pay-page URL the email/portal link allowlist accepts). Leave unset.
# PAY_PUBLIC_BASE = ""

# R2 bucket holding device-generated invoice PDFs (2026-08-06 spec) so the
# 15-min auto-email sweep can attach the SAME PDF the manual send produces.
# Owner op before this works in prod:
#   wrangler r2 bucket create tradeready-invoice-pdfs
[[r2_buckets]]
binding = "INVOICE_PDFS"
bucket_name = "tradeready-invoice-pdfs"

# R2 bucket mirroring job photos for cross-device sync + reinstall survival
# (2026-08-06 job-photo R2 sync spec). Key scheme: {userId}/{photoId}.jpg.
# Owner op before this works in prod:
#   wrangler r2 bucket create tradeready-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "tradeready-photos"

# Phase 19 e-signatures (docs/superpowers/specs/2026-10-03-esignature-upgrade-
# design.md §8, §11). Owner steps, never committed with values here until then:
#   stage B: ESIGN_SEAL_PRIVATE_KEY via `wrangler secret put`; then add to [vars]
#            ESIGN_SEAL_KEY_ID = "<key id>" and
#            ESIGN_SEAL_PUBLIC_KEYS = '{"<key id>":"<base64 raw public key>"}'
#            (public; keep every old key listed after a rotation).
#   stage C: ESIGN_V2 = "true", then ESIGN_REQUIRE_CONSENT = "true".
# Both flags are OFF while unset; with ESIGN_V2 off the estimate routes behave
# exactly as before Phase 19.

# Phase 12B: portal photo URLs are HMAC-signed with PORTAL_URL_SIGNING_SECRET
# (set via `wrangler secret put PORTAL_URL_SIGNING_SECRET` — never in this
# file). Missing secret = portal photos section stays empty and the
# photos-public route 404s (fail-soft).

# Phase 3 staging remains deliberately inert until a separate Supabase project
# or branch exists. Wrangler vars and bindings are not inherited by named
# environments, so repeat every staging value explicitly. Do not replace this
# placeholder with the production Supabase URL.
[env.staging]
name = "tradeready-backend-staging"
workers_dev = true

[env.staging.triggers]
crons = []

[env.staging.vars]
SUPABASE_URL = "https://staging.invalid"
ESTIMATE_PUBLIC_BASE = "https://gettradereadyapp.com/estimate.html"

[[env.staging.r2_buckets]]
binding = "INVOICE_PDFS"
bucket_name = "tradeready-invoice-pdfs-staging"

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "tradeready-photos-staging"
