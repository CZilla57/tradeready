# SwiftUI migration gate on a macOS runner. The Linux gate (gate.yml) cannot
# build or test any Swift, so nothing under native/ was compiled automatically.
# Two legs, both unsigned (no secrets, no signing, no uploads):
#   host-tests     - every focused Swift host runner (all failures reported in
#                    one pass), the fixture-manifest check, backend-workers tests
#   release-build  - the generic-iOS Release build from CLAUDE.md
# Runs on PRs and pushes that touch the native app, the Worker, or the manifest
# tooling. macOS minutes cost more than Linux, so path filters keep it narrow and
# a newer push cancels the run it supersedes.
name: Native macOS gate

on:
  push:
    branches: [master]
    paths:
      - 'native/**'
      - 'backend-workers/**'
      - 'scripts/parity-*'
      - 'docs/native-fixture-manifest.json'
      - 'docs/native-parity-matrix.md'
      - 'docs/native-*.md'
      - '.github/workflows/native-macos.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'backend-workers/**'
      - 'scripts/parity-*'
      - 'docs/native-fixture-manifest.json'
      - 'docs/native-parity-matrix.md'
      - 'docs/native-*.md'
      - '.github/workflows/native-macos.yml'
  workflow_dispatch:

concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  # A west-of-UTC timezone exposes the FA-039 local-date bugs (CLAUDE.md).
  TZ: America/Phoenix

jobs:
  host-tests:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-workers/package-lock.json

      # The aggregate ends with `npm test` in backend-workers.
      - name: Install Worker dependencies
        working-directory: backend-workers
        run: npm ci

      - name: Select newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          swiftc --version

      - name: Fixture manifest and doc references
        run: |
          sh native/run-fixture-manifest-check.sh
          sh native/run-doc-reference-check.sh

      # Every runner must be invoked by run-all-domain-tests.sh, which the loop
      # below does not use.
      - name: Runner registration guard
        run: sh native/check-runner-registration.sh

      - name: Worker tests
        working-directory: backend-workers
        run: npm test

      # Runs every focused runner and reports all failures in one pass, unlike
      # native/run-all-domain-tests.sh, which stops at the first (and also owns
      # the registration guard; run it locally for that).
      - name: Swift host runners
        run: |
          failed=""
          for r in native/run-*-tests.sh; do
            case "$r" in native/run-all-domain-tests.sh) continue ;; esac
            echo "::group::$r"
            if sh "$r"; then echo "PASS $r"; else failed="$failed $r"; echo "FAIL $r"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            for f in $failed; do echo "::error::runner failed: $f"; done
            exit 1
          fi

  release-build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # Swift packages (Sentry, PostHog, Google Sign-In, ...) resolve into a
      # fixed directory so the cache can key on the resolved lockfile.
      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('native/TradeReadyNative.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Release build (unsigned, generic iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -project native/TradeReadyNative.xcodeproj \
            -scheme TradeReadyNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 200
