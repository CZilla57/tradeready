# The verify gate (typecheck / tests / lint) that has always run manually
# from the repo root — now also enforced on every push and PR so a red gate
# can't land unnoticed. Same three legs, same green criteria (lint runs with
# --max-warnings=0 via the package script).
#
# A fourth leg (2026-07-16): gitleaks secret scanning over the full git
# history. Known public-by-design client keys (Supabase publishable key,
# PostHog project key) are fingerprinted in .gitleaksignore; anything else
# fails the gate. --redact keeps any real finding out of the public CI logs.
name: Verify gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Persist Jest's transform cache (.jest-cache, see jest.config.js
      # cacheDirectory) between runs — cold Babel transforms of the RN module
      # graph dominate the Tests leg on this 2-core runner. actions/cache never
      # updates an existing key, so a static key would freeze the cache at its
      # first save; keying per commit and restoring the newest lockfile-prefix
      # match keeps it warm as the repo grows. Jest validates entries by
      # content hash, so a stale restore is safe; a lockfile change starts the
      # prefix fresh (transform output depends on dependency versions).
      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      - name: Lint
        run: npm run lint

  # The standalone web portal (web/) has its own package.json, lockfile, and
  # Vite/React/Vitest toolchain — the RN gate above never installs its deps.
  # This leg gives it an independent gate: lint, tests, typecheck, and a
  # production build, all run from web/ against its own lockfile.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — the scan covers every commit, not just HEAD

      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact
